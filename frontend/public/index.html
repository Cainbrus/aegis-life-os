        <style>
            /* Splash screen loading styles */
            #splash-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                transition: opacity 0.5s ease-out;
            }
            #splash-screen.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #splash-screen svg {
                width: 120px;
                height: 120px;
                animation: pulse 2s infinite;
            }
            #splash-screen p {
                color: #06b6d4;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                font-size: 24px;
                font-weight: bold;
                margin-top: 20px;
                letter-spacing: 4px;
            }
            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.05); opacity: 0.8; }
            }
        </style>
    </head>

        <div id="splash-screen">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>

                        <stop offset="0%" style="stop-color:#06b6d4"/>
                        <stop offset="100%" style="stop-color:#8b5cf6"/>
                    </linearGradient>

                <path fill="url(#shield-gradient)" d="M100 20L30 55v50c0 45 30 87 70 105 40-18 70-60 70-105V55L100 20zm0 25l50 25v35c0 32-22 63-50 78-28-15-50-46-50-78V70l50-25z"/>

        </div>
        
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        
        <script>
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js')
                        .then(reg => console.log('Aegis SW registered'))
                        .catch(err => console.log('SW registration failed:', err));
                });
            }
            
            // Hide splash screen after app loads
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const splash = document.getElementById('splash-screen');
                    if (splash) {
                        splash.classList.add('hidden');
                        setTimeout(() => splash.remove(), 500);
                    }
                }, 1500);
            });
        </script>

                        font-size: 12px !important;
