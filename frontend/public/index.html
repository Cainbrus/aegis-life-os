        <!-- Splash Screens for iOS -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        
        <title>Aegis | Your Digital Mate</title>
        
        <style>
            /* Splash screen loading styles */
            #splash-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 50% 40%, #16244a 0%, #0B1121 70%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                transition: opacity 0.5s ease-out;
            }
            #splash-screen.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #splash-screen img {
                width: 180px;
                height: 180px;
                object-fit: contain;
                animation: pulse 2.4s infinite;
                filter: drop-shadow(0 0 30px rgba(37,99,235,0.45));
            }
            #splash-screen .brand {
                color: #ffffff;
                font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                font-size: 26px;
                font-weight: 800;
                margin-top: 14px;
                letter-spacing: 6px;
            }
            #splash-screen .tag {
                color: #60a5fa;
                font-family: 'Outfit', sans-serif;
                font-size: 12px;
                margin-top: 6px;
                letter-spacing: 1px;
            }
            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 1; }
                50% { transform: scale(1.04); opacity: 0.85; }
            }
        </style>
    </head>
    <body>
        <!-- Splash Screen -->
        <div id="splash-screen">
            <img src="/brand/shield-emblem.png" alt="Digital Mate" />
            <p class="brand">DIGITAL MATE</p>
            <p class="tag">Your Digital Bodyguard. Your Trusted Mate.</p>
        </div>
        
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        
        <script>
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('/sw.js')
                        .then(reg => console.log('Aegis SW registered'))
                        .catch(err => console.log('SW registration failed:', err));
                });
            }
            
            // Hide splash screen after app loads
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const splash = document.getElementById('splash-screen');
                    if (splash) {
                        splash.classList.add('hidden');
                        setTimeout(() => splash.remove(), 500);
                    }
                }, 1500);
            });
        </script>
